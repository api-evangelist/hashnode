source: https://registry.npmjs.org/
description: >-
  First-party Hashnode client libraries and tooling. Hashnode publishes no
  language SDK for the GraphQL API - the documented integration path is plain
  HTTP POST with a Personal Access Token, plus the official agent skill. The
  @hashnode npm scope carries a docs CLI, a React component library, and an
  integration utility package; none has shipped a release since 2025-03, and the
  CLI has been static since 2024-11, which predates every 2026 API change
  (Pro gating, the gql-beta endpoint move, the AEO fields).

