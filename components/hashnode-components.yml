description: >-
  Client-side and embeddable surfaces Hashnode publishes. Hashnode's headless story
  is a forkable Next.js starter kit rather than a drop-in embed library: there is no
  hosted widget, no script-tag loader, and no embeddable dashboard. The one true
  component library in the @hashnode scope, Matrix UI, is Hashnode's internal design
  system published publicly, not an API-consuming widget set.

