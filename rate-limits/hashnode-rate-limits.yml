specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Hashnode
providerId: hashnode
created: '2026-05-04'
modified: '2026-06-13'
tags:
  - Blogging
  - Content
  - Developer Community
  - Rate Limiting
  - GraphQL
  - Stellate
description: Rate limit definitions for the Hashnode GraphQL API. Hashnode fronts
  the gql.hashnode.com endpoint with Stellate, a GraphQL edge-cache CDN, which
  enforces the rate limits. Unauthenticated requests are throttled per IP address;
  authenticated requests (Personal Access Token in the Authorization header) are
  throttled per token.
infrastructure:
  edgeCache: Stellate (GraphQL CDN)
  endpoint: https://gql.hashnode.com
  authHeader: Authorization
  authType: PersonalAccessToken
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - tier: all
    name: Unauthenticated Request Limit
    scope: ip
    metric: requests_per_minute
    limit: 2000
    timeFrame: minute
    notes: Applied per IP address for requests without an Authorization header via Stellate CDN
    applies:
      - Hashnode GraphQL API
  - tier: all
    name: Authenticated Request Limit
    scope: api-key
    metric: requests_per_minute
    limit: 500
    timeFrame: minute
    notes: Applied per Personal Access Token for requests with an Authorization header via Stellate CDN
    applies:
      - Hashnode GraphQL API
policies:
  - name: Stellate Edge Caching
    description: Hashnode uses Stellate as a GraphQL CDN in front of gql.hashnode.com.
      Cacheable read queries may be served from the edge cache and may not count
      against per-request rate limits.
  - name: Backoff Strategy
    description: Clients receiving a 429 response should implement exponential backoff
      with jitter, honoring the Retry-After header when present.
  - name: Authentication Preferred
    description: Authenticated requests with a Personal Access Token have a higher
      per-minute cap (500 rpm) than unauthenticated requests (2000 rpm per IP).
      Use authentication for production integrations to avoid shared IP throttling.
  - name: Personal Access Token Generation
    description: Personal Access Tokens are generated at https://hashnode.com/settings/developer.
      Tokens must be passed in the Authorization header of each GraphQL request.
  - name: Fair Use
    description: Sustained high-volume usage that materially impacts shared infrastructure
      may be subject to additional throttling or account review regardless of documented
      limits.
maintainers:
