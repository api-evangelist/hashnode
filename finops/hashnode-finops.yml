# Coverage demoted 2026-10-07 (roadmap#942, PLAN.md Stage A): this file was written by an API Evangelist
# sweep and names no billing unit, meters or pricing category read from the provider — it restates the
# FinOps framework. It is `x-coverage: unmeasured`, and the FOCUS alignment it claimed has been removed.
x-coverage: unmeasured
specification: FinOps Framework
specificationVersion: '1.0'
provider: Hashnode
providerId: hashnode
publisherName: Hashnode
serviceCategory: API
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-06-13'
tags:
  - Blogging
  - Content
  - Developer Community
  - FinOps
  - Cost Management
  - FOCUS
description: >-
  FinOps framework definition for Hashnode platform and API costs. Corrected
  2026-08-13 - the tier ladder previously described here (Pro $7, Startup $199,
  Enterprise) was written by a 2026-05-04 bulk sweep and no longer exists.
  Hashnode's published model is per-publication subscription - Free ($0), Pro
  ($5/month or $50/year per publication, seat-based for teams), and Growth (Pro
  plus a flat $29/month for the AEO toolkit). There is no Enterprise or
  contact-sales tier. The GraphQL API is NOT included at every tier - since
  2026-05-13 every publication-scoped read and every mutation requires the target
  publication to hold an active Pro plan, so API access is a subscription line
  item rather than a free platform feature. There are no per-request charges,
  so cost allocation is driven entirely by publication count, seat count, and
  tier selection. See plans/hashnode-plans-pricing.yml for the searched source.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Hashnode
  ServiceCategory: Developer Tools / API
  ProviderName: Hashnode
  PublisherName: Hashnode
  InvoiceIssuerName: Hashnode
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Hashnode API
    baseURL: ''
    tags:
      - Blogging
      - Content
      - GraphQL
    serviceName: Hashnode API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
maintainers:
