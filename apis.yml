aid: hashnode
name: Hashnode
description: >-
  Hashnode is a blogging platform for developers and engineering teams, offering
  publications on a custom domain, a headless CMS mode, and a public GraphQL API
  covering posts, drafts, publications, users, tags, series, comments and
  documentation projects. The API is a single GraphQL endpoint with anonymous
  introspection; authentication is a Personal Access Token in the Authorization
  header, with no OAuth and no scopes. Since 13 May 2026 the API has been a paid
  feature - anonymous public reads still work, but every publication-scoped read
  and every write mutation requires the target publication to hold an active
  Hashnode Pro plan. Hashnode publishes no OpenAPI and no MCP server, shipping an
  official Agent Skill instead.
