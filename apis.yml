apis:
  - aid: hashnode:hashnode-graphql-api
    name: Hashnode GraphQL API
    description: The Hashnode Public API is a GraphQL API that queries publication
      data, manages posts and drafts, and creates content via mutations. All requests
      are POSTed to a single endpoint at https://gql-beta.hashnode.com. Introspection
      is enabled and anonymous, so the SDL is the published contract - 123 types,
      13 root queries and 9 root mutations. Anonymous public reads (post, feed, user,
      tag) require no token; publication-scoped reads and all mutations require a
      Personal Access Token and an active Pro plan on the target publication. The
      legacy endpoint gql.hashnode.com now returns HTTP 301 to a deprecation notice.
