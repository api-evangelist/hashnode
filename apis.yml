apis:
  - aid: hashnode:hashnode-graphql-api
    name: Hashnode GraphQL API
    description: The Hashnode Public API is a GraphQL API that allows developers to
      query publication data, manage posts and drafts, interact with newsletters,
      and create content via mutations. All requests go through a single GraphQL
      endpoint at https://gql.hashnode.com. Public read queries require no authentication;
      all mutations require a Personal Access Token in the Authorization header.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
