customer_surface_note: >-
  Hashnode does serve llms.txt - but on customer publications, not on hashnode.com.
  The AEO toolkit shipped 2026-08-12 makes a Growth-plan blog serve its own
  /llms.txt exposing the blog's recent 100 posts as markdown, gated by the
  Publication.aeoSettings.llmsTxtEnabled field. That is a per-tenant feature of the
  product, not a discovery document Hashnode publishes about its own API.

