source: live HTTP probes of every host in apis.yml
description: >-
  Recorded absence. Neither hashnode.com nor the live API host gql-beta.hashnode.com
  serves any /.well-known/ discovery document. Every path below returned a real 404.
  No WellKnown, SecurityTxt, or APICatalog pointer is emitted from this file, because
  the file documents that the surface is not served.

soft_200_warning: >-
  https://hashnode.com/security.txt returns HTTP 200 but the body is the Next.js
  application shell rendering "User not found" - the site routes unknown top-level
  paths to a username lookup. It is a soft 404, not a security.txt, and must not be
  counted as a served document. The same shape applies to
  https://hashnode.com/llms.txt (HTTP 200, 68 KB of HTML application shell, no
  llms.txt content) and https://hashnode.com/vulnerability-disclosure.

