status: none
description: >-
  Hashnode ships NO MCP server, and says so on the record. Its official agent
  surface is an Agent Skill (skills/hashnode-gql-api.md), and its own FAQ explains
  the choice: "This is a skill: a set of instructions and references the agent
  loads into context, so it can call the GraphQL API directly with plain HTTP.
  There is no extra server process, and it works in any skills-compatible agent."
  This is a deliberate architectural decision by the provider, not a gap - recorded
  here so the absence is a measured fact rather than an unchecked assumption.

deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    No first-party hosted endpoint and no first-party stdio package exist. The
    agent path Hashnode supports is `npx skills add Hashnode/gql-skill`, which
    installs context for an agent to call GraphQL over HTTP itself - it starts no
    server and is not MCP.

tools: []

official_agent_surface:
  kind: agent-skill
  artifact: skills/_index.yml
  install: npx skills add Hashnode/gql-skill
  transport: none - the agent makes plain HTTPS POSTs to the GraphQL endpoint

third_party_servers:
  note: >-
    Community MCP servers wrapping the Hashnode GraphQL API exist. They are listed
    for completeness only. None is published, endorsed, or maintained by Hashnode,
    and none is counted as a Hashnode agent surface.
